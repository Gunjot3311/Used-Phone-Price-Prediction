<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Used Phone Price Predictor</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6fb;margin:0;padding:24px;color:#1f2430}
  .card{max-width:820px;margin:auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{margin-top:0}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
  input,select{padding:8px;border:1px solid #cdd3e0;border-radius:8px;font-size:14px}
  button{grid-column:1/-1;padding:12px;border:0;border-radius:10px;background:#3b5bdb;color:#fff;font-size:16px;cursor:pointer}
  #result{margin-top:20px;font-size:22px;font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>📱 Used Phone Price Predictor</h1>
  <form id="f">
    {% for col, opts in meta.cat.items() %}
    <label>{{ col.replace('_',' ').title() }}
      <select name="{{ col }}">{% for o in opts %}<option>{{ o }}</option>{% endfor %}</select>
    </label>
    {% endfor %}
    {% for col, n in meta.num.items() %}
    <label>{{ col.replace('_',' ').title() }}
      {% if n.binary %}
      <select name="{{ col }}"><option value="0">No</option><option value="1">Yes</option></select>
      {% else %}
      <input type="number" step="any" name="{{ col }}" min="{{ n.min }}" max="{{ n.max }}" value="{{ n.default }}">
      {% endif %}
    </label>
    {% endfor %}
    <button type="submit">Predict resale price</button>
  </form>
  <div id="result"></div>
</div>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  const out = document.getElementById("result");
  out.textContent = "Predicting…";
  try {
    const r = await fetch("/predict", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    const d = await r.json();
    out.textContent = "Estimated resale price: " + d.price.toLocaleString();
  } catch (err) { out.textContent = "Something went wrong."; }
});
</script>
</body>
</html>
